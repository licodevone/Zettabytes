name: CI

on:
  push:
    branches: [master, "release/**"]
  pull_request:
    branches: [master, "release/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck e testes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: zettabytes
          POSTGRES_PASSWORD: zettabytes
          POSTGRES_DB: zettabytes_test
        ports:
          - 5442:5432
        options: >-
          --health-cmd "pg_isready -U zettabytes -d zettabytes_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://zettabytes:zettabytes@localhost:5442/zettabytes_test
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - run: pnpm install --frozen-lockfile
      - run: pnpm bootstrap
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
